version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: invoiceshelf-mysql-3307
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invoiceshelf
      MYSQL_USER: invoiceshelf
      MYSQL_PASSWORD: invoiceshelf
    ports:
      - "3307:3306"
    volumes:
      - invoiceshelf_mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  invoiceshelf_mysql_data: